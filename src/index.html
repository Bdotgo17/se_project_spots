<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="???" />
    <meta name="keywords" content="HTML, CSS???" />
    <meta name="author" content="Baruc Gomez" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header__logo"></div>
      </header>
      <main class="content">
        <section class="profile page__section">
          <button class="profile__avatar-btn">
            <img alt="Bessie Coleman" class="profile__avatar" />
            <div class="profile__edit-wrapper">
              <img class="profile__pencil-icon" alt="Pencil Icon" src="" />
            </div>
          </button>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">New Post</button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button type="button" class="card__delete-button"></button>
                <img class="card__image" alt="Card image" />
                <div class="card__content">
                  <h2 class="card__title">Card Title</h2>
                  <span class="card__like-count">0</span>
                  <button type="button" class="card__like-button"></button>
                </div>
              </li>
            </template>
          </ul>
          <div class="cards-container"></div>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__text">2025&copy;Spots</p>
      </footer>

      <div id="edit-profile-modal" class="modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Edit Profile</h2>
          <form name="edit-profile" novalidate class="modal__form">
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
                required
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="add-card-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">New Post</h2>
          <form name="link" class="modal__form" id="add-card-form" novalidate>
            <label for="add-card-link-input" class="modal__label">
              Image link
              <input
                id="add-card-link-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="add-card-link-input-error" class="modal__error"></span>
            </label>
            <label for="add-card-name-input" class="modal__label">
              Caption
              <input
                id="add-card-name-input"
                type="text"
                class="modal__input"
                name="name"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
                required
              />
              <span id="add-card-name-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="preview-modal">
        <div class="modal__container modal__container_type_preview">
          <button type="button" class="modal__close-btn"></button>
          <img class="modal__image" src="" alt="" />
          <p class="modal__caption"></p>
        </div>
      </div>

      <div class="modal" id="avatar-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h3 class="modal__title">Edit profile avatar</h3>
          <form
            name="edit-avatar"
            id="edit-avatar-form"
            class="modal__form"
            novalidate
          >
            <label for="profile-avatar-input" class="modal__label">
              Profile Picture
              <input
                id="profile-avatar-input"
                type="url"
                class="modal__input"
                name="avatar"
                placeholder="Place the link to an image"
                required
              />
              <span id="profile-avatar-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div id="delete-modal" class="modal">
        <div class="modal__content">
          <h2>Are you sure you want to delete this image?</h2>
          <form id="delete-form" class="modal__form">
            <button id="delete-btn" class="modal__delete-btn">Delete</button>
            <button id="cancel-btn" class="modal__cancel-btn" type="button">Cancel</button>
          </form>
        </div>
      </div>

      <!-- <form class="form" novalidate>
        <input type="text" id="name" class="form__input" required />
        <span id="name-error" class="form__error"></span>

        <input type="email" id="email" class="form__input" required />
        <span id="email-error" class="form__error"></span>

        <button
          type="submit"
          class="form__submit form__submit_disabled"
          disabled
        >
          Submit
        </button>
      </form> -->
    </div>
  </body>
</html>
